name: Temporary dependency lock refresh

on:
  push:
    branches:
      - security/update-wppconnect-puppeteer

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from pinned manifest ranges
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
